# Сборка прод-образов в GitHub Actions: на сервере 2 ГБ RAM, сборка Next.js там уронит n8n и Dokploy.
# Dokploy только тянет готовые образы из GHCR (docker-compose.prod.yml).
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [back, email-worker, front]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/qjetshk/fts-${{ matrix.app }}:latest
            ghcr.io/qjetshk/fts-${{ matrix.app }}:${{ github.sha }}
          # NEXT_PUBLIC_* вшиваются в бандл фронта; значения публичные, ключ PostHog — в Variables репозитория
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.easyfts.ru/api
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=https://eu.i.posthog.com
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
