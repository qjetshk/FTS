#dev
services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: fts_user
      POSTGRES_PASSWORD: fts_pass
      POSTGRES_DB: fts_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - '6379:6379'

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        HTTP_PROXY: http://host.docker.internal:10810
        HTTPS_PROXY: http://host.docker.internal:10810
    container_name: fts-back
    restart: always
    ports:
      - '${PORT}:${PORT}' # порт берём из .env
      - "51212:51212"
    env_file: .env
    # host.docker.internal → прокси на хосте (TELEGRAM_PROXY): своего DNS наружу у контейнера нет
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/app # монтируем текущую папку внутрь контейнера
    command: npm run start:dev # hot-reload
    depends_on:
      - postgres
      - redis

  # без build: готовый образ + node_modules с хоста (npm install в ../email-worker), docker в сеть не ходит
  email-worker:
    image: node:22-alpine
    container_name: fts-email-worker
    restart: always
    working_dir: /app
    env_file: ../email-worker/.env
    environment:
      REDIS_HOST: redis
      # внутренний API бэка (XML статформ для вложений); значения подставляются из back/.env
      BACK_INTERNAL_URL: http://app:${PORT}/api
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      - ../email-worker:/app
    command: npm run start:dev
    depends_on:
      - redis


volumes:
  pgdata: