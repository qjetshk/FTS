#dev
services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: fts_user
      POSTGRES_PASSWORD: fts_pass
      POSTGRES_DB: fts_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - '6379:6379'

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        HTTP_PROXY: http://host.docker.internal:10810
        HTTPS_PROXY: http://host.docker.internal:10810
    container_name: fts-back
    restart: always
    ports:
      - '${PORT}:${PORT}' # порт берём из .env
      - "51212:51212"
    env_file: .env
    volumes:
      - .:/app # монтируем текущую папку внутрь контейнера
    command: npm run start:dev # hot-reload
    depends_on:
      - postgres
      - redis

 

volumes:
  pgdata: