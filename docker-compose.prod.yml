# Прод: compose-проект Dokploy (Compose Path: ./docker-compose.prod.yml).
# Значения ${...} — из Environment проекта в Dokploy (шаблон: .env.prod.example). Секретов в файле нет — репо публичный.
# Образы собираются вне сервера (2 ГБ RAM — сборка Next.js там не влезает) и загружаются в Docker сервера:
#   docker build -t fts-<app>:latest <app> && docker save fts-<app>:latest | gzip | ssh <server> 'gunzip | docker load'
# pull_policy: never — Dokploy берёт уже загруженный образ, а не ищет его в реестре.
# Postgres — общий контейнер с pgvector (тот же, что у n8n), отдельная база и пользователь, ходим по dokploy-network.
# Домены (Traefik + Let's Encrypt) вешаются в UI Dokploy на сервисы front (easyfts.ru, порт 3000) и back (api.easyfts.ru, порт 4200).
# mem_limit — чтобы наш стек не выдавил n8n и Dokploy при нехватке памяти.
services:
  redis:
    image: redis:7
    restart: unless-stopped
    # очереди BullMQ: данные задач переживают рестарт, вытеснение ключей недопустимо
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction
    mem_limit: 96m
    volumes:
      - redisdata:/data

  # HTTP-прокси за рубеж: api.telegram.org из РФ недоступен. Конфиг собирает /opt/xray/update.sh по крону
  xray:
    image: teddysun/xray
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - /opt/xray/config.json:/etc/xray/config.json:ro

  back:
    image: fts-back:latest
    pull_policy: never
    restart: unless-stopped
    mem_limit: 384m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      PORT: 4200
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TELEGRAM_PROXY: http://xray:10809
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRE: ${JWT_ACCESS_EXPIRE}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      XML_ENCRYPTION_KEY: ${XML_ENCRYPTION_KEY}
      N8N_URL: ${N8N_URL}
      N8N_STATFORM_WEBHOOK_URL: ${N8N_STATFORM_WEBHOOK_URL}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      N8N_API_KEY: ${N8N_API_KEY}
      N8N_STATFORM_WORKFLOW_ID: ${N8N_STATFORM_WORKFLOW_ID}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
      BULL_BOARD_USER: ${BULL_BOARD_USER}
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD}
    depends_on:
      - redis
      - xray
    networks:
      default:
      # общая сеть с n8n и Postgres (другие проекты Dokploy): n8n ходит в бэк по http://fts-back:4200, без ngrok
      dokploy-network:
        aliases: [fts-back]

  email-worker:
    image: fts-email-worker:latest
    pull_policy: never
    restart: unless-stopped
    mem_limit: 192m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACK_INTERNAL_URL: http://back:4200/api
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
    depends_on:
      - redis
      - back

  front:
    image: fts-front:latest
    pull_policy: never
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NODE_OPTIONS: --max-old-space-size=192

volumes:
  redisdata:

networks:
  dokploy-network:
    external: true
